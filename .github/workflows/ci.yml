name: CI & Deployment

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit-Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
      - name: End-to-End-Tests (Abnahmeszenarien)
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    # Veröffentlicht die App auf GitHub Pages, sobald auf main gepusht wird.
    # Voraussetzung: Repository → Settings → Pages → Source: "GitHub Actions".
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
